<!-- design a collage website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
        }

        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }

        nav a:hover {
            background-color: #555;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .collage-item {
            width: 300px;
            height: 200px;
            margin: 10px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Collage Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="content">
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
        <div class="collage-item" style="background-image: url('https://via.placeholder.com/300x200');"></div>
    </div>
</body>
</html>
