<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333333;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444444;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd6dd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2d6cdf;
        }

        .btn-login {
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 6px;
            background: #2d6cdf;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-login:hover {
            background: #245dc0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Login</h1>
        <form>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
</body>
</html>
